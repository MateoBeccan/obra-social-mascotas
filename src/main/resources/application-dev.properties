spring.config.import=optional:file:.env[.properties]

# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/${POSTGRES_DB}
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=false

# MinIO
app.storage.endpoint=http://localhost:9000
app.storage.region=us-east-1
app.storage.access-key=${MINIO_ROOT_USER}
app.storage.secret-key=${MINIO_ROOT_PASSWORD}
app.storage.bucket=os-mascotas-private

# JWT
app.security.jwt.issuer=obra-social-mascotas
app.security.jwt.expiration=PT30M
app.security.jwt.secret=${JWT_SECRET}
app.security.password-recovery.expiration=PT15M
app.security.account-activation.expiration=${ACCOUNT_ACTIVATION_EXPIRATION:PT24H}
app.security.bootstrap-admin.enabled=${BOOTSTRAP_ADMIN_ENABLED:false}
app.security.bootstrap-admin.identificador-acceso=${BOOTSTRAP_ADMIN_IDENTIFIER:}
app.security.bootstrap-admin.email-recuperacion=${BOOTSTRAP_ADMIN_EMAIL:}
app.security.bootstrap-admin.password=${BOOTSTRAP_ADMIN_PASSWORD:}

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized
